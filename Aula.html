<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aula • Launch Mastery</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles/aula.css" />
</head>
<body>
  <section id="aula" class="aula">
    <!-- overlay atenuante sobre el fondo -->
    <div class="aula__overlay"></div>
    <div class="aula__grid">
      <!-- Card 1 -->
      <div class="aula__card">
        <div class="aula__card-header">  
          <img src="Recursos/icons/time-and-calendar.png" alt="Tu clase empieza en:" />
        </div>
        <div class="aula__card-body">
          <p class="aula__label">Tu clase empieza en:</p>
          <p class="aula__count">09:00:00:00</p>
        </div>
        <div class="aula__card-footer">
        <button id="to-calendar-btn" class="aula__link">Ver más → Calendario</button>
        </div>
      </div>
      <!-- Card 2 -->
      <div class="aula__card">
        <div class="aula__card-header">
          <img src="Recursos/icons/libro.png" alt="Material de preparación" />
        </div>
        <div class="aula__card-body">
          <p class="aula__label">Material de preparación</p>
        </div>
        <div class="aula__card-footer">
          <a href="#" class="aula__link">Ver más</a>
        </div>
      </div>
      <!-- Card 3 -->
      <div class="aula__card">
        <div class="aula__card-header">
          <img src="Recursos/icons/consola-de-juego.png" alt="Juega" />
        </div>
        <div class="aula__card-body">
          <p class="aula__label">Juega</p>
        </div>
        <div class="aula__card-footer">
          <a href="#" class="aula__link">Ver más</a>
        </div>
      </div>
      <!-- Card 4 -->
      <div class="aula__card">
        <div class="aula__card-header">
          <img src="Recursos/img/logo.webp" alt="Lugre Academy" />
        </div>
        <div class="aula__card-body">
          <p class="aula__label">Luque™ Academy</p>
        </div>
        <div class="aula__card-footer">
          <a href="#" class="aula__link">Ver más</a>
        </div>
      </div>
      <!-- Card 5 -->
      <div class="aula__card">
        <div class="aula__card-header">
          <img src="Recursos/icons/rebobinar.png" alt="LM24" />
        </div>
        <div class="aula__card-body">
          <p class="aula__label">LM24</p>
        </div>
        <div class="aula__card-footer">
          <a href="#" class="aula__link">Ver más</a>
        </div>
      </div>
      <!-- Card 6 -->
      <div class="aula__card">
        <div class="aula__card-header">
          <img src="Recursos/icons/charla.png" alt="Chat" />
        </div>
        <div class="aula__card-body">
          <p class="aula__label">Chat</p>
        </div>
        <div class="aula__card-footer">
          <a href="#" class="aula__link">Ver más</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/aula.js"></script>
</body>
</html>
