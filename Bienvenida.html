<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenido • Launch Mastery</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles/bienvenida.css" />
</head>
<body>
  <div class="welcome">
    <!-- Contenedor Izquierdo: texto + botón -->
    <div class="welcome-text">
      <h1>¡Encantado de que estés aquí,<br><span id="nombre"></span>!</h1>
      <p>Bienvenido a:</p>
      <h2 class="launch">LAUNCH<span class="tm">™</span></h2>
      <h2 class="mastery">MASTERY</h2>
      <p>El Día 1 ya está listo para ti.</p>
      <button class="btn go-btn">Ir a mi Aula →</button>
    </div>

    <!-- Contenedor Derecho: la tarjeta -->
    <div class="welcome-card">
      <div class="card">
        <!-- 1) Encabezado -->
        <div class="card-header">
          <h1 class="card-launch">
            LAUNCH<span class="tm">™</span>
          </h1>
          <h2 class="card-mastery">MASTERY</h2>
        </div>
      
        <!-- 2) Cuerpo con día y usuario -->
        <div class="card-body">
          <div class="card-day">DÍA 1</div>
          <div class="username-badge">Daniel Angarita</div>
        </div>
      
        <!-- 3) Pie con logo -->
        <div class="card-footer">
          <img src="Recursos/img/logo.webp" alt="Logo Lugre Academy" class="card-logo"/>
        </div>
      </div>
    </div>
  </div>

  <script src="js/bienvenida.js"></script>
</body>
</html>
